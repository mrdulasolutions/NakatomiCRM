name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nakatomi
          POSTGRES_PASSWORD: nakatomi
          POSTGRES_DB: nakatomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakatomi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nakatomi:nakatomi@localhost:5432/nakatomi_test
      SECRET_KEY: ci-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: create migrate database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          eng = create_engine(
              "postgresql+psycopg://nakatomi:nakatomi@localhost:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with eng.connect() as c:
              exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname='nakatomi_migrate'")).scalar()
              if not exists:
                  c.execute(text("CREATE DATABASE nakatomi_migrate"))
          PY
      - name: pytest
        env:
          TEST_MIGRATE_URL: postgresql+psycopg://nakatomi:nakatomi@localhost:5432/nakatomi_migrate
        run: pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nakatomi:ci
